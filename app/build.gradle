plugins {
    id "com.android.application"
}

android {
    namespace "com.sneakysnakes"
    compileSdk 35

    defaultConfig {
        applicationId "com.sneakysnakes"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "4.0.0"
    }

    sourceSets {\n        main { assets.srcDirs += ["../SneakySnakes/Resources/content"] }\n    }\n\n    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
