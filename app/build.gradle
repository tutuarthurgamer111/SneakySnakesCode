plugins {
    id "com.android.application"
}

android {
    namespace "com.sneakysnakes"
    compileSdk 35

    defaultConfig {
        applicationId "com.sneakysnakes"
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName "4.0.1"
    }

    sourceSets {
        main {
            assets.srcDirs += ["../SneakySnakes/Resources/content"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
