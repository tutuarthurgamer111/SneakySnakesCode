plugins {
    id "com.android.application"
}

android {
    namespace "com.sneakysnakes"
    compileSdk 35

    defaultConfig {
        applicationId "com.sneakysnakes"
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName "4.0.2"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("ANDROID_SIGNING_KEYSTORE") ?: "upload-key.jks")
            storePassword System.getenv("ANDROID_SIGNING_STORE_PASSWORD")
            keyAlias System.getenv("ANDROID_SIGNING_KEY_ALIAS")
            keyPassword System.getenv("ANDROID_SIGNING_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug {
            if (System.getenv("ANDROID_SIGNING_KEYSTORE") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    sourceSets {
        main {
            assets.srcDirs += ["../SneakySnakes/Resources/content"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
