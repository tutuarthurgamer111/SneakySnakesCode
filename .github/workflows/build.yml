name: Build SneakySnakes for Windows and Android

on:
  workflow_dispatch:
  push:
    branches: [main, android-port]

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare mobile audio
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          mkdir -p app/src/main/assets/audio
          for file in background track1 track2 track3 track4 click eat hit; do
            ffmpeg -y -i "SneakySnakes/Resources/content/sounds/${file}.wav" -vn -codec:a libmp3lame -b:a 112k "app/src/main/assets/audio/${file}.mp3"
          done
      - name: Prepare Android launcher icon from favicon.ico
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          convert "SneakySnakes/Resources/favicon.ico[0]" -background none -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert "SneakySnakes/Resources/favicon.ico[0]" -background none -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert "SneakySnakes/Resources/favicon.ico[0]" -background none -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert "SneakySnakes/Resources/favicon.ico[0]" -background none -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert "SneakySnakes/Resources/favicon.ico[0]" -background none -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Decode persistent Android signing key
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          if [ -z "$ANDROID_SIGNING_KEY_BASE64" ]; then
            echo "Missing ANDROID_SIGNING_KEY_BASE64 GitHub secret" >&2
            exit 1
          fi
          echo "$ANDROID_SIGNING_KEY_BASE64" | base64 --decode > app/upload-key.jks
      - name: Build APK
        env:
          ANDROID_SIGNING_KEYSTORE: upload-key.jks
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SneakySnakes-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk

  windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile desktop game and prepare resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/classes, build/package-input | Out-Null
          $files = Get-ChildItem src -Filter *.java -File | ForEach-Object { $_.FullName }
          javac -encoding UTF-8 -d build/classes $files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          jar --create --file build/package-input/SneakySnakes.jar --main-class SneakySnakes -C build/classes .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package EXE installer
        shell: pwsh
        run: |
          jpackage --type app-image --name SneakySnakes --app-version 3.0.0 --input build/package-input --main-jar SneakySnakes.jar --main-class SneakySnakes --dest build/installer --vendor "SneakySnakes"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force build/installer/SneakySnakes/SneakySnakes | Out-Null
          Copy-Item -Recurse SneakySnakes/Resources build/installer/SneakySnakes/SneakySnakes/
          Copy-Item -Recurse data build/installer/SneakySnakes/
      - name: Upload Windows app (EXE launcher)
        uses: actions/upload-artifact@v4
        with:
          name: SneakySnakes-Windows-EXE
          path: build/installer/SneakySnakes/
